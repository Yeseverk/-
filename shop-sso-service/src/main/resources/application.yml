server:
  port: 8087
spring:
  cloud:
    nacos:
      discovery:  # 注册中心
        server-addr: localhost:8848
  application:
    name: shop-sso-service
  profiles:
    active: dev

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.cjc.controller  # 改成你自己的启动类包名