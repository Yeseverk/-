server:
  port: 8088

spring:
  cloud:
    nacos:
      discovery:  # 注册中心
        server-addr: localhost:8848
  application:
    name: shop-order-service
  datasource:
    password: 123456
    username: root
    url: jdbc:mysql://localhost:3306/shop_order?useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0

# RocketMQ配置
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: order-producer-group

# Seata 分布式事务配置
seata:
  tx-service-group: my_test_tx_group  # 事务分组名称
  service:
    vgroup-mapping:
      my_test_tx_group: default  # 分组映射到集群
    grouplist:
      default: 127.0.0.1:8091  # Seata Server地址
  registry:
    type: file
  config:
    type: file

mybatis:
  mapper-locations: classpath:mapper/*Mapper.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.cjc.controller